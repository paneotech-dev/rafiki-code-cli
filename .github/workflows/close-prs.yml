name: close-prs

on:
  schedule:
    - cron: "0 22 * * *" # Daily at 10:00 PM UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log matching PRs without closing them"
        type: boolean
        default: true
      max-close:
        description: "Maximum matching PRs to close"
        type: string
        required: false
        default: "50"

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Close old PRs without enough positive reactions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MAX_CLOSE: ${{ inputs['max-close'] }}
          DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          max_close="${MAX_CLOSE:-50}"
          if ! [[ "$max_close" =~ ^[0-9]{1,4}$ ]]; then
            echo "::error::max-close must be a whole number."
            exit 1
          fi

          args=("--threshold" "2" "--age-months" "1" "--sleep-ms" "20000" "--max-close" "$max_close")

          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=("--execute")
          elif [ "$DRY_RUN" = "false" ]; then
            args+=("--execute")
          fi

          bun script/github/close-prs.ts "${args[@]}"
