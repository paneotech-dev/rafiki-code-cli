name: release

# Builds every rafikicode binary, proves each one before anything is public,
# then publishes: the GitHub release first, and from it npm, Homebrew and winget.
#
#   preflight       the tag is a version, and every secret the run needs exists
#                   (a pre-release needs none; see below)
#   build           all twelve builds, packed with LICENSE and NOTICE, SHA256SUMS
#   gate            one job per published build: a clean container or runner for
#                   that platform, the documented install, --version, the licence
#                   files, a sign-in with the staging test account and one hello
#                   world task against staging (install/release-gate.sh)
#   install-matrix  the twenty container cells of install/test-matrix.sh, run
#                   against the same archives
#   publish         only when every gate job and the matrix passed: the release
#                   is created as a draft, every asset is uploaded and checked,
#                   and only then is it published
#   npm, homebrew, winget   each installs the archives of the published release
#
# A failed build blocks the whole release: publish needs every gate job, the
# gate matrix does not fail fast so the summary names every build that failed,
# and nothing is uploaded anywhere before publish.
#
# Trigger: push a tag v<version>, for example v0.2.0.
#
# Secrets. A release (no hyphen in the version) needs all four, and preflight
# stops the run, naming each one that is absent, before anything is built:
#   RAFIKICODE_STAGING_API_KEY  API key of the staging test account (gate)
#   NPM_TOKEN                   npm automation token for the package rafikicode
#   HOMEBREW_TAP_TOKEN          token that can push to paneotech-dev/homebrew-tap
#   WINGET_TOKEN                token wingetcreate uses to open the pull request
#                               on microsoft/winget-pkgs
# A pre-release (v0.2.0-rc.1) is published to GitHub only and needs none of
# them. Without RAFIKICODE_STAGING_API_KEY it runs everything except the two
# gate facets that call staging (signin and task), which every gate job
# records as "skipped (no staging key, pre-release)", and its release notes
# say so.
# Variables, optional: RAFIKICODE_STAGING_GATEWAY_URL and
# RAFIKICODE_STAGING_CONSOLE_URL, when staging is not the product default.
#
# Signing: the macOS builds are signed ad hoc (no Developer ID, not notarised)
# with rcodesign in the build job, once each binary is final, and every page
# hash is checked there; the macOS gate jobs check them again with Apple's
# codesign. Nothing else is code signed; SHA256SUMS is the integrity check.
#
# Untrusted values (the tag name and the dispatch input) reach scripts only
# through env variables, always quoted, and the tag is refused unless it is v
# followed by a semantic version before any other step uses it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v0.1.0)"
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      live_gate: ${{ steps.secrets.outputs.live_gate }}
    steps:
      - id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "${#TAG}" -gt 64 ] || ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::The tag must be v followed by a semantic version, for example v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # A version with a pre-release part is published as a pre-release on
          # GitHub, never becomes "latest", and goes to no package manager.
          case "${TAG#v}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Every channel a released binary tells its user about has to be
      # publishable by this run: `rafikicode upgrade` offers npm, Homebrew and
      # winget, and the install page documents them. So the run stops here,
      # before a build minute is spent, when it could not publish one of them
      # or could not gate the builds. Secrets are compared with the empty
      # string only; none is printed.
      #
      # A pre-release goes to GitHub only, so it needs no publishing token, and
      # without the staging key it is still built, signed and gated: live_gate
      # is then false and the gate jobs skip only signin and task, explicitly.
      - name: Require every secret the release needs
        id: secrets
        shell: bash
        env:
          RAFIKICODE_STAGING_API_KEY: ${{ secrets.RAFIKICODE_STAGING_API_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          required=()
          if [ "$PRERELEASE" != "true" ]; then
            required+=(RAFIKICODE_STAGING_API_KEY NPM_TOKEN HOMEBREW_TAP_TOKEN WINGET_TOKEN)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error title=release::The repository secret ${name} is not set. The release needs it and does not run without it."
            done
            {
              echo "## Release not started"
              echo
              echo "Missing repository secrets: ${missing[*]}."
              echo "Nothing was built and nothing was published. See docs/install.md, section For maintainers."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "${RAFIKICODE_STAGING_API_KEY:-}" ]; then
            echo "live_gate=true" >> "$GITHUB_OUTPUT"
          else
            # Only a pre-release reaches this line without the key.
            echo "live_gate=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=release::Pre-release without the staging key: live checks against staging are skipped; every other check runs. Set the repository secret RAFIKICODE_STAGING_API_KEY to run them."
            echo "Pre-release without the staging key: live checks against staging are skipped; every other check runs" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "All required secrets are present."

  build:
    name: build all platforms
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      # The macOS builds are cross compiled here, and the compiler leaves a
      # signature that does not match the file (0.1.9: a wrong last page hash on
      # arm64, the Bun runtime's own Developer ID signature on x64). build.ts
      # signs each one ad hoc with rcodesign once it is final, and stops when
      # rcodesign is missing or the result does not check out.
      - name: Install rcodesign, which signs the macOS builds
        shell: bash
        env:
          RCODESIGN_VERSION: "0.29.0"
          RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          set -euo pipefail
          name="apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl"
          dir="$RUNNER_TEMP/rcodesign"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/${name}.tar.gz"
          echo "${RCODESIGN_SHA256}  $dir/$name.tar.gz" | sha256sum -c -
          tar -xzf "$dir/$name.tar.gz" -C "$dir" --strip-components=1 "$name/rcodesign"
          "$dir/rcodesign" --version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build binaries
        shell: bash
        run: ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ needs.preflight.outputs.version }}
          OPENCODE_CHANNEL: latest
          RAFIKICODE_REQUIRE_MACOS_SIGNATURE: "1"

      - name: Package archives, licence files and checksums
        shell: bash
        run: |
          set -euo pipefail
          install/package-release.sh packages/opencode/dist
          # Written by the build script: which targets the runner could execute
          # and which were built without being started once. The gate below is
          # what starts the rest.
          cat packages/opencode/dist/PLATFORM-COVERAGE.md

      # The binaries exactly as shipped, taken back out of their archives: an
      # ad hoc signature that covers the whole file, with every page hash and
      # every special slot right. rcodesign verify is not used for this: 0.29.0
      # rejects its own ad hoc signatures. The macOS gate jobs below run Apple's
      # codesign on the same files.
      - name: Check the signatures of the macOS builds
        shell: bash
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/macos-signatures"
          for target in darwin-arm64 darwin-x64 darwin-x64-baseline; do
            mkdir -p "$check/$target"
            unzip -oq "packages/opencode/dist/rafikicode-${target}.zip" rafikicode -d "$check/$target"
          done
          bun packages/opencode/script/macos-signature.ts "$check"/*/rafikicode

      # The npm package holds no binary, only the checksums of the archives
      # above, so it can be packed now and installed by the gate before
      # anything is published.
      - name: Pack the npm package
        shell: bash
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ needs.preflight.outputs.version }}
          OPENCODE_CHANNEL: latest
          PACK: "1"
        run: bun run script/publish-npm.ts

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rafikicode-release
          path: |
            packages/opencode/dist/rafikicode-*.tar.gz
            packages/opencode/dist/rafikicode-*.zip
            packages/opencode/dist/SHA256SUMS
            packages/opencode/dist/PLATFORM-COVERAGE.md
            packages/opencode/dist/npm/rafikicode-*.tgz
          if-no-files-found: error

  gate:
    name: gate ${{ matrix.target }} (${{ matrix.channel }})
    needs: [preflight, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Every build is judged, so one red run names every build that failed.
      fail-fast: false
      matrix:
        include:
          # Linux: a clean container on a runner of the build's own
          # architecture. Debian for the glibc builds, Alpine for musl.
          - { target: linux-x64, channel: installer, runner: ubuntu-24.04, mode: container }
          - { target: linux-x64-baseline, channel: installer, runner: ubuntu-24.04, mode: container }
          - { target: linux-x64-musl, channel: installer, runner: ubuntu-24.04, mode: container }
          - { target: linux-x64-baseline-musl, channel: installer, runner: ubuntu-24.04, mode: container }
          - { target: linux-arm64, channel: installer, runner: ubuntu-24.04-arm, mode: container }
          - { target: linux-arm64-musl, channel: installer, runner: ubuntu-24.04-arm, mode: container }
          # macOS: no container exists for it, so the hosted runner, which is a
          # new virtual machine for every job, is the clean image.
          - { target: darwin-arm64, channel: installer, runner: macos-15, mode: host }
          - { target: darwin-x64, channel: installer, runner: macos-15-intel, mode: host }
          - { target: darwin-x64-baseline, channel: installer, runner: macos-15-intel, mode: host }
          # Windows: the hosted runner again, with install.ps1.
          - { target: windows-x64, channel: installer, runner: windows-2025, mode: windows }
          - { target: windows-x64-baseline, channel: installer, runner: windows-2025, mode: windows }
          - { target: windows-arm64, channel: installer, runner: windows-11-arm, mode: windows }
          # The npm package, installed from its packed tarball in a container
          # that has Node and nothing else of ours.
          - { target: linux-x64, channel: npm, runner: ubuntu-24.04, mode: container }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rafikicode-release
          path: release-assets

      # Apple's own check of the signature, before the binary is started. A
      # failure fails this job, and publish needs every gate job.
      - name: Check the code signature with codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GATE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signature"
          mkdir -p "$dir"
          unzip -oq "release-assets/rafikicode-${GATE_TARGET}.zip" rafikicode -d "$dir"
          codesign --verify --strict --verbose=2 "$dir/rafikicode"
          codesign --display --verbose=2 "$dir/rafikicode"

      - name: Gate the build (Linux container or macOS runner)
        if: matrix.mode != 'windows'
        shell: bash
        env:
          RAFIKICODE_STAGING_API_KEY: ${{ secrets.RAFIKICODE_STAGING_API_KEY }}
          RAFIKICODE_STAGING_GATEWAY_URL: ${{ vars.RAFIKICODE_STAGING_GATEWAY_URL }}
          RAFIKICODE_STAGING_CONSOLE_URL: ${{ vars.RAFIKICODE_STAGING_CONSOLE_URL }}
          GATE_TARGET: ${{ matrix.target }}
          GATE_CHANNEL: ${{ matrix.channel }}
          GATE_MODE: ${{ matrix.mode }}
          GATE_VERSION: ${{ needs.preflight.outputs.version }}
          LIVE_GATE: ${{ needs.preflight.outputs.live_gate }}
        run: |
          set -euo pipefail
          args=(--target "$GATE_TARGET" --version "$GATE_VERSION" --assets release-assets
                --channel "$GATE_CHANNEL" --results "$RUNNER_TEMP/gate-results.tsv")
          [ "$GATE_MODE" = "host" ] && args+=(--host)
          [ "$LIVE_GATE" = "false" ] && args+=(--no-live)
          [ "$GATE_CHANNEL" = "npm" ] && args+=(--npm-tarball "release-assets/npm/rafikicode-${GATE_VERSION}.tgz")
          install/release-gate.sh "${args[@]}"

      - name: Gate the build (Windows runner)
        if: matrix.mode == 'windows'
        shell: pwsh
        env:
          RAFIKICODE_STAGING_API_KEY: ${{ secrets.RAFIKICODE_STAGING_API_KEY }}
          RAFIKICODE_STAGING_GATEWAY_URL: ${{ vars.RAFIKICODE_STAGING_GATEWAY_URL }}
          RAFIKICODE_STAGING_CONSOLE_URL: ${{ vars.RAFIKICODE_STAGING_CONSOLE_URL }}
          GATE_TARGET: ${{ matrix.target }}
          GATE_VERSION: ${{ needs.preflight.outputs.version }}
          LIVE_GATE: ${{ needs.preflight.outputs.live_gate }}
        run: |
          $gateArgs = @{
            Target = $env:GATE_TARGET
            Version = $env:GATE_VERSION
            Assets = 'release-assets'
            Results = (Join-Path $env:RUNNER_TEMP 'gate-results.tsv')
          }
          if ($env:LIVE_GATE -eq 'false') { $gateArgs.NoLive = $true }
          ./install/release-gate.ps1 @gateArgs
          exit $LASTEXITCODE

      - name: Keep the verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-${{ matrix.target }}-${{ matrix.channel }}
          path: ${{ runner.temp }}/gate-results.tsv
          if-no-files-found: warn

  install-matrix:
    name: install matrix
    needs: [preflight, build]
    # The twenty cells of install/test-matrix.sh: the machines users actually
    # have (a noexec /tmp, no bash, a read-only home), run against the archives
    # built above and before any of them is public. The gate above covers every
    # build once; this covers three builds in every environment.
    uses: ./.github/workflows/install-matrix.yml
    with:
      release-version: ${{ needs.preflight.outputs.version }}
      assets-artifact: rafikicode-release

  publish:
    name: publish GitHub release
    # Every gate job and the matrix. A failed or cancelled job among them
    # leaves this one skipped, and nothing has been published by then.
    needs: [preflight, build, gate, install-matrix]
    runs-on: ubuntu-24.04
    permissions:
      # Creates the GitHub release and uploads its assets.
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          fetch-tags: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rafikicode-release
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-gate-*
          path: gate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: install-matrix-*
          path: matrix
          merge-multiple: true

      - name: Write the gate record
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          LIVE_GATE: ${{ needs.preflight.outputs.live_gate }}
        run: |
          set -euo pipefail
          # One row per build, channel and facet, as each gate job reported it.
          cat gate/*/gate-results.tsv > gate-results.tsv
          {
            echo "# Release gate for v${VERSION}"
            echo
            echo "Each build was installed in a clean container or on a fresh hosted runner for its"
            echo "platform, with the documented install command, and then asked for its version, its"
            echo "licence files, a sign-in with the staging test account and one hello world task"
            echo "against staging. The release is published only when every row is a pass."
            if [ "$PRERELEASE" = "true" ] && [ "$LIVE_GATE" = "false" ]; then
              echo
              echo "This pre-release was gated without the staging key: signin and task were not run"
              echo "and read \"skipped (no staging key, pre-release)\". Every other check ran."
            fi
            echo
            echo "| build | channel | install | version | licence | signin | task |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            awk -F'\t' '
              { key = $1 "\t" $2; if (!(key in seen)) { seen[key] = 1; order[++n] = key } v[key, $3] = $4 }
              END { for (i = 1; i <= n; i++) { k = order[i]; split(k, p, "\t");
                printf "| %s | %s | %s | %s | %s | %s | %s |\n", p[1], p[2], v[k, "install"], v[k, "version"], v[k, "licence"], v[k, "signin"], v[k, "task"] } }
            ' gate-results.tsv
          } > dist/RELEASE-GATE.md
          cat dist/RELEASE-GATE.md >> "$GITHUB_STEP_SUMMARY"
          # The jobs already failed the run if a facet failed. This is the same
          # rule applied to the record itself: thirteen rows of five passes, or
          # the release does not go out. A pre-release gated without the
          # staging key may have signin and task skipped, and nothing else.
          rows=$(awk -F'\t' '{print $1 "\t" $2}' gate-results.tsv | sort -u | wc -l | tr -d ' ')
          allow_skip=0
          [ "$PRERELEASE" = "true" ] && [ "$LIVE_GATE" = "false" ] && allow_skip=1
          bad=$(awk -F'\t' -v skip="$allow_skip" '
            $4 == "pass" { next }
            skip == 1 && ($3 == "signin" || $3 == "task") && $4 == "skipped (no staging key, pre-release)" { next }
            { n++ } END { print n + 0 }' gate-results.tsv)
          total=$(wc -l < gate-results.tsv | tr -d ' ')
          if [ "$rows" != "13" ] || [ "$total" != "65" ] || [ "$bad" != "0" ]; then
            echo "::error title=release gate::Expected 13 gated builds with 5 passing facets each; found ${rows} builds, ${total} verdicts, ${bad} not passing."
            exit 1
          fi

      - name: Create the release as a draft, upload everything, then publish
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          LIVE_GATE: ${{ needs.preflight.outputs.live_gate }}
        run: |
          set -euo pipefail
          # install.sh and install.ps1 ship as release assets so that
          # releases/latest/download/install.sh always serves the installer of
          # the newest release; get.rafikiai.io points at that one URL.
          cp "$GITHUB_WORKSPACE/install/install.sh" install.sh
          cp "$GITHUB_WORKSPACE/install/install.ps1" install.ps1
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          cp "$GITHUB_WORKSPACE/NOTICE" NOTICE
          if [ -s "$GITHUB_WORKSPACE/matrix/INSTALL-MATRIX.md" ]; then
            cp "$GITHUB_WORKSPACE/matrix/INSTALL-MATRIX.md" INSTALL-MATRIX.md
          else
            echo "::error title=release::The install matrix left no INSTALL-MATRIX.md, so the release page would say nothing about how it installs."
            exit 1
          fi
          shopt -s nullglob
          assets=(rafikicode-*.tar.gz rafikicode-*.zip SHA256SUMS PLATFORM-COVERAGE.md INSTALL-MATRIX.md RELEASE-GATE.md install.sh install.ps1 LICENSE NOTICE)

          # Order matters. releases/latest, and with it get.rafikiai.io and the
          # daily update check, follow the newest published release. A release
          # that is published before its installer and SHA256SUMS are uploaded
          # answers 404 for both until they arrive. So the release is a draft,
          # which "latest" never points at, until every asset is on it.
          state=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "absent")
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          case "$state" in
            absent)
              gh release create "$TAG" --draft --title "$TAG" --generate-notes --verify-tag "${flags[@]}"
              gh release upload "$TAG" "${assets[@]}" --clobber
              ;;
            true)
              # A draft left by an earlier attempt of this run.
              gh release upload "$TAG" "${assets[@]}" --clobber
              ;;
            *)
              # Already public, from an earlier run for this tag. Replacing an
              # asset removes it and uploads it again, which opens the very
              # window this job exists to close, so it is refused.
              echo "::error title=release::A published release for ${TAG} already exists. This workflow does not replace the assets of a public release. Delete the release (not the tag) and run again, or cut a new version."
              exit 1
              ;;
          esac

          # Publish only what is complete: every asset named above is on the draft.
          uploaded=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          missing=0
          for asset in "${assets[@]}"; do
            if ! printf '%s\n' "$uploaded" | grep -qxF "$asset"; then
              echo "::error title=release::${asset} is not on the draft release."
              missing=1
            fi
          done
          [ "$(printf '%s\n' "${assets[@]}" | grep -c '^rafikicode-.*\.\(tar\.gz\|zip\)$')" = "12" ] || { echo "::error title=release::Expected 12 archives."; missing=1; }
          [ "$missing" = "0" ] || exit 1

          # A pre-release gated without the staging key says so on its page.
          # The draft may be left by an earlier attempt, so the line is added once.
          if [ "$PRERELEASE" = "true" ] && [ "$LIVE_GATE" = "false" ]; then
            line="Live checks against staging were skipped for this pre-release because the staging key is not configured."
            notes="$RUNNER_TEMP/release-notes.md"
            gh release view "$TAG" --json body --jq '.body' > "$notes"
            if ! grep -qxF "$line" "$notes"; then
              printf '\n%s\n' "$line" >> "$notes"
              gh release edit "$TAG" --notes-file "$notes"
            fi
          fi

          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi

      - name: Check that the latest release serves its installer and checksums
        if: needs.preflight.outputs.prerelease != 'true'
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # What a user's `curl -fsSL https://get.rafikiai.io | bash` and the
          # daily update check ask for, straight after the publish.
          base="https://github.com/${REPO}/releases"
          ok=false
          for attempt in $(seq 1 12); do
            latest=$(curl -sS -o /dev/null -w '%{redirect_url}' "${base}/latest" || true)
            if [ "${latest##*/}" = "$TAG" ] \
               && curl -fsSL -o /dev/null "${base}/latest/download/install.sh" \
               && curl -fsSL -o /dev/null "${base}/latest/download/install.ps1" \
               && curl -fsSL -o /dev/null "${base}/latest/download/SHA256SUMS"; then
              ok=true
              echo "attempt ${attempt}: latest is ${TAG} and serves install.sh, install.ps1 and SHA256SUMS"
              break
            fi
            echo "attempt ${attempt}: latest is '${latest##*/}', or an asset is not served yet"
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::error title=release::Two minutes after publishing, releases/latest does not serve the installer and SHA256SUMS of ${TAG}."
            exit 1
          fi

          # The address itself. It is a redirect kept outside this repository,
          # so the requests above do not cover it. The checkout is the tag, so
          # install/install.sh is the file that was uploaded.
          want=$(sha256sum "$GITHUB_WORKSPACE/install/install.sh" | cut -d' ' -f1)
          body="${RUNNER_TEMP:-/tmp}/get-rafikiai-io.body"
          ok=false
          for attempt in $(seq 1 12); do
            rm -f "$body"
            code=$(curl -sSL --max-time 30 -o "$body" -w '%{http_code}' https://get.rafikiai.io || true)
            got=$(sha256sum "$body" 2>/dev/null | cut -d' ' -f1 || true)
            if [ "$code" = "200" ] && [ "$got" = "$want" ]; then
              ok=true
              echo "attempt ${attempt}: get.rafikiai.io serves the install.sh of ${TAG}, sha256 ${want}"
              break
            fi
            echo "attempt ${attempt}: get.rafikiai.io answered ${code} with sha256 '${got}', expected ${want}"
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::error title=release::Two minutes after publishing, https://get.rafikiai.io does not serve the install.sh of ${TAG}."
            exit 1
          fi

  npm:
    name: publish npm package
    needs: [preflight, publish]
    if: needs.preflight.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The checksums packed into the package are the ones the release
      # published, fetched from the release itself.
      - name: Fetch the published SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p packages/opencode/dist
          gh release download "$TAG" --pattern SHA256SUMS --dir packages/opencode/dist --repo "$GITHUB_REPOSITORY"

      - name: Publish to npm
        shell: bash
        working-directory: packages/opencode
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENCODE_VERSION: ${{ needs.preflight.outputs.version }}
          OPENCODE_CHANNEL: latest
        run: |
          set -euo pipefail
          # The script stops with a message naming NPM_TOKEN when it is absent.
          bun run script/publish-npm.ts

      - name: Install the published package and start it
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # The registry can take a moment to serve a version it just accepted.
          for attempt in $(seq 1 12); do
            if npm install -g "rafikicode@${VERSION}"; then break; fi
            [ "$attempt" = "12" ] && { echo "::error title=npm::rafikicode@${VERSION} could not be installed from the registry."; exit 1; }
            sleep 10
          done
          got=$(rafikicode --version)
          [ "$got" = "$VERSION" ] || { echo "::error title=npm::The npm install printed version '${got}', expected ${VERSION}."; exit 1; }

  homebrew:
    name: update the Homebrew tap
    needs: [preflight, publish]
    if: needs.preflight.outputs.prerelease != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Render the formula from the published SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS --dir published --repo "$GITHUB_REPOSITORY"
          node install/channels/render.mjs --version "$VERSION" --sums published/SHA256SUMS --out rendered

      - name: Push the formula to paneotech-dev/homebrew-tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=homebrew::The repository secret HOMEBREW_TAP_TOKEN is not set, so the tap cannot be updated. Homebrew users stay on the previous version until it is."
            exit 1
          fi
          gh auth setup-git
          git clone --depth 1 https://github.com/paneotech-dev/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp rendered/homebrew/rafikicode.rb tap/Formula/rafikicode.rb
          cd tap
          git config user.name "rafikicode release"
          git config user.email "release@rafikiai.io"
          git add Formula/rafikicode.rb
          if git diff --cached --quiet; then
            echo "The tap already carries the formula for ${VERSION}."
            exit 0
          fi
          git commit -m "rafikicode ${VERSION}"
          git push origin HEAD

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: homebrew-formula
          path: rendered/homebrew/rafikicode.rb
          if-no-files-found: warn

  homebrew-verify:
    name: install from the tap on macOS
    needs: [preflight, homebrew]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: brew install and start it
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew tap paneotech-dev/tap
          brew install paneotech-dev/tap/rafikicode
          got=$(rafikicode --version)
          [ "$got" = "$VERSION" ] || { echo "::error title=homebrew::brew installed version '${got}', expected ${VERSION}."; exit 1; }
          rafikicode licenses | grep -q "Permission is hereby granted"
          brew test paneotech-dev/tap/rafikicode

  winget:
    name: submit the winget manifest
    needs: [preflight, publish]
    if: needs.preflight.outputs.prerelease != 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}

      - name: Render the manifests from the published SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern SHA256SUMS --dir published --repo "$GITHUB_REPOSITORY"
          node install/channels/render.mjs --version "$VERSION" --sums published/SHA256SUMS --out rendered

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests
          path: rendered/winget
          if-no-files-found: error

      # The community repository reviews every submission, so this opens a pull
      # request and the package is installable once that is merged, not when
      # this job ends.
      - name: Validate and submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Host "::error title=winget::The repository secret WINGET_TOKEN is not set, so the manifest cannot be submitted. The rendered manifests are in the winget-manifests artifact of this run."
            exit 1
          }
          winget validate --manifest rendered\winget
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=winget::winget validate refused the manifests."; exit 1 }
          Invoke-WebRequest -UseBasicParsing -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --prtitle "New version: PaneoTech.RafikiCode version $env:VERSION" --token $env:WINGET_TOKEN rendered\winget
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=winget::wingetcreate could not open the pull request."; exit 1 }
