# Rafiki Code pull request review, single file version.
#
# Copy this file into your own repository as
# .github/workflows/rafikicode-pr-review.yml. On every pull request opened from
# a branch of the same repository it installs a pinned rafikicode release,
# checks the key, reviews the diff on rafiki-fast and posts the review as a
# pull request comment. Every model call uses credits in your Rafiki AI account,
# within the key's budget. The full walkthrough is docs/github-action.md.
#
# Setup, once per repository (Settings, Secrets and variables, Actions):
#   secret    RAFIKICODE_API_KEY  a key from console.rafikiai.io/keys, created
#                                 with the Rafiki Code option ticked
#   variable  RAFIKICODE_VERSION  a release number, for example 0.1.1
#   variable  RAFIKICODE_SHA256   the hash of rafikicode-linux-x64.tar.gz from
#                                 that release's SHA256SUMS file
#
# Secrets are not given to workflows started by pull requests from forks, so
# those pull requests are skipped. Keep the trigger on pull_request: do not
# switch to pull_request_target with a checkout of the pull request head.
name: Rafiki Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rafikicode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODEL: rafiki/rafiki-fast
      MAX_DIFF_LINES: "4000"
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          # The base branch, not the pull request head: the reviewer reads the
          # diff, and nothing from the pull request is executed.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          # Keeps the job token out of .git/config.
          persist-credentials: false

      - name: Install rafikicode
        env:
          VERSION: ${{ vars.RAFIKICODE_VERSION }}
          SHA256: ${{ vars.RAFIKICODE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ] || [ -z "${SHA256}" ]; then
            echo "Set the repository variables RAFIKICODE_VERSION and RAFIKICODE_SHA256." >&2
            exit 1
          fi
          asset=rafikicode-linux-x64.tar.gz
          dir="${RUNNER_TEMP}/rafikicode-bin"
          mkdir -p "${dir}"
          curl -fsSL --proto '=https' --proto-redir '=https' -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/paneotech-dev/rafiki-code-cli/releases/download/v${VERSION}/${asset}"
          # The variable may hold one hash or whole SHA256SUMS lines.
          expected=$(printf '%s\n' "${SHA256}" | awk -v a="${asset}" 'NF==1 || $2==a {print $1; exit}')
          echo "${expected}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${dir}"
          echo "${dir}" >> "${GITHUB_PATH}"
          "${dir}/rafikicode" --version

      - name: Check the key and the gateway
        env:
          RAFIKICODE_API_KEY: ${{ secrets.RAFIKICODE_API_KEY }}
        # Stops the job before any model call when the key is missing,
        # revoked, out of budget, or the gateway cannot be reached.
        run: rafikicode doctor

      - name: Read the pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rafikicode-review"
          gh pr diff "${PR_NUMBER}" > "${RUNNER_TEMP}/rafikicode-review/full.diff"
          total=$(wc -l < "${RUNNER_TEMP}/rafikicode-review/full.diff")
          head -n "${MAX_DIFF_LINES}" "${RUNNER_TEMP}/rafikicode-review/full.diff" > "${RUNNER_TEMP}/rafikicode-review/pr.diff"
          echo "DIFF_LINES=${total}" >> "${GITHUB_ENV}"
          if [ ! -s "${RUNNER_TEMP}/rafikicode-review/pr.diff" ]; then
            echo "The pull request diff is empty; nothing to review." >&2
            exit 1
          fi

      - name: Review the change
        id: review
        env:
          RAFIKICODE_API_KEY: ${{ secrets.RAFIKICODE_API_KEY }}
          # The reviewer may read the checkout, nothing else: no edits, no
          # shell commands, no web fetches, no reads inside .git.
          OPENCODE_PERMISSION: '{"edit":"deny","bash":"deny","webfetch":"deny","read":{".git":"deny",".git/*":"deny","*/.git/*":"deny"}}'
        run: |
          set -uo pipefail
          prompt="You are reviewing a pull request. Read the unified diff that follows and write a review in Markdown with these sections: Summary (two or three sentences), Bugs and risks (each item with file and line, most serious first, or 'none found'), Suggestions (optional, short). Judge only what the diff shows. Do not restate the diff. Do not edit files or run commands."
          if [ "${DIFF_LINES}" -gt "${MAX_DIFF_LINES}" ]; then
            prompt="${prompt} The diff was cut at ${MAX_DIFF_LINES} of ${DIFF_LINES} lines; say so in the summary."
          fi
          rafikicode run --model "${MODEL}" "${prompt}" \
            < "${RUNNER_TEMP}/rafikicode-review/pr.diff" > "${RUNNER_TEMP}/rafikicode-review/review.md" 2> "${RUNNER_TEMP}/rafikicode-review/review.err"
          code=$?
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" -ne 0 ]; then cat "${RUNNER_TEMP}/rafikicode-review/review.err" >&2; fi
          exit 0

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODE: ${{ steps.review.outputs.code }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/rafikicode-review/comment.md"
          {
            echo "## Rafiki Code review"
            echo
            case "${CODE}" in
              0) cat "${RUNNER_TEMP}/rafikicode-review/review.md" ;;
              2) echo "The review did not run: the Rafiki AI key was refused. Check the key in the Rafiki AI console." ;;
              3) echo "The review did not run: the key's budget or the account's credits are spent. Nothing was charged." ;;
              4) echo "The review did not run: the Rafiki AI gateway could not be reached from the runner." ;;
              *) echo "The review did not complete (exit code ${CODE}). See the workflow log." ;;
            esac
            echo
            echo "_Reviewed on ${MODEL}. Spend is shown on the key's page in the Rafiki AI console._"
          } > "${body}"
          gh pr comment "${PR_NUMBER}" --body-file "${body}"
          # A failed review turns the check red instead of passing silently.
          exit "${CODE}"
